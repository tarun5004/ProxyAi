AWSTemplateFormatVersion: "2010-09-09"
Description: ProxiAI adapter for existing AWS foundation resources and optional missing HTTPS/log resources.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [production, staging]
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  NatGatewayId:
    Type: String
    AllowedPattern: "^nat-[0-9a-f]+$"
  ClusterArn:
    Type: String
    AllowedPattern: "^arn:aws:ecs:[a-z0-9-]+:[0-9]{12}:cluster/proxiai-production$"
  LoadBalancerArn:
    Type: String
    AllowedPattern: "^arn:aws:elasticloadbalancing:[a-z0-9-]+:[0-9]{12}:loadbalancer/app/proxiai-alb/[0-9a-f]+$"
  HttpListenerArn:
    Type: String
    AllowedPattern: "^arn:aws:elasticloadbalancing:[a-z0-9-]+:[0-9]{12}:listener/app/proxiai-alb/[0-9a-f]+/[0-9a-f]+$"
  LoadBalancerSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  TaskSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  FrontendTargetGroupArn:
    Type: String
    AllowedPattern: "^arn:aws:elasticloadbalancing:[a-z0-9-]+:[0-9]{12}:targetgroup/proxiai-[a-z0-9-]+/[0-9a-f]+$"
  ApiTargetGroupArn:
    Type: String
    AllowedPattern: "^arn:aws:elasticloadbalancing:[a-z0-9-]+:[0-9]{12}:targetgroup/proxiai-[a-z0-9-]+/[0-9a-f]+$"
  TaskExecutionRoleArn:
    Type: String
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:role/proxiai-ecs-execution-role$"
  TaskRoleArn:
    Type: String
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:role/proxiai-ecs-task-role$"
  FrontendLogGroupName:
    Type: String
    AllowedPattern: "^/ecs/proxiai/(production|staging)/frontend$"
  ApiLogGroupName:
    Type: String
    AllowedPattern: "^/ecs/proxiai/(production|staging)/api$"
  WorkerLogGroupName:
    Type: String
    AllowedPattern: "^/ecs/proxiai/(production|staging)/worker$"
  RuntimeSecretArn:
    Type: String
    NoEcho: true
    AllowedPattern: "^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:proxiai/(production|staging)-[A-Za-z0-9]+$"
  DomainName:
    Type: String
    Default: ""
  CertificateArn:
    Type: String
    Default: ""
  CreateMissingLogGroups:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  CreateHttpsListener:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Rules:
  HttpsInputsRequired:
    RuleCondition: !Equals [!Ref CreateHttpsListener, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref DomainName, ""]]
        AssertDescription: DomainName is required when creating the HTTPS listener.
      - Assert: !Not [!Equals [!Ref CertificateArn, ""]]
        AssertDescription: CertificateArn is required when creating the HTTPS listener.

Conditions:
  CreateLogGroups: !Equals [!Ref CreateMissingLogGroups, "true"]
  CreateHttps: !Equals [!Ref CreateHttpsListener, "true"]

Resources:
  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateLogGroups
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Ref FrontendLogGroupName
      RetentionInDays: 7

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateLogGroups
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Ref ApiLogGroupName
      RetentionInDays: 7

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateLogGroups
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Ref WorkerLogGroupName
      RetentionInDays: 7

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: CreateHttps
    Properties:
      LoadBalancerArn: !Ref LoadBalancerArn
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroupArn

  ApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: CreateHttps
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/api/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroupArn

  HealthListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: CreateHttps
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/health/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroupArn

Outputs:
  ClusterArn:
    Value: !Ref ClusterArn
  VpcId:
    Value: !Ref VpcId
  PublicSubnetIds:
    Value: !Join [",", !Ref PublicSubnetIds]
  PrivateSubnetIds:
    Value: !Join [",", !Ref PrivateSubnetIds]
  NatGatewayId:
    Value: !Ref NatGatewayId
  LoadBalancerArn:
    Value: !Ref LoadBalancerArn
  HttpListenerArn:
    Value: !Ref HttpListenerArn
  HttpsListenerArn:
    Value: !If [CreateHttps, !Ref HttpsListener, ""]
  LoadBalancerSecurityGroupId:
    Value: !Ref LoadBalancerSecurityGroupId
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroupId
  FrontendTargetGroupArn:
    Value: !Ref FrontendTargetGroupArn
  ApiTargetGroupArn:
    Value: !Ref ApiTargetGroupArn
  TaskExecutionRoleArn:
    Value: !Ref TaskExecutionRoleArn
  TaskRoleArn:
    Value: !Ref TaskRoleArn
  FrontendLogGroupName:
    Value: !Ref FrontendLogGroupName
  ApiLogGroupName:
    Value: !Ref ApiLogGroupName
  WorkerLogGroupName:
    Value: !Ref WorkerLogGroupName
  RuntimeSecretArn:
    Value: !Ref RuntimeSecretArn
  PublicOrigin:
    Value: !If [CreateHttps, !Sub "https://${DomainName}", ""]
