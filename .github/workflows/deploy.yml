name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  build-release:
    if: >-
      vars.ECS_RELEASE_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      backend_image: ${{ steps.images.outputs.backend_image }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable images
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          FRONTEND_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
          BACKEND_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY }}
        run: |
          docker build --build-arg COMMIT_SHA="${RELEASE_SHA}" --tag "${FRONTEND_REPOSITORY}:${RELEASE_SHA}" frontend
          docker build --build-arg COMMIT_SHA="${RELEASE_SHA}" --tag "${BACKEND_REPOSITORY}:${RELEASE_SHA}" backend
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ vars.FRONTEND_ECR_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ vars.BACKEND_ECR_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Push SHA images once
        env:
          FRONTEND_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
          BACKEND_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY }}
          FRONTEND_REPOSITORY_NAME: ${{ vars.FRONTEND_ECR_REPOSITORY_NAME }}
          BACKEND_REPOSITORY_NAME: ${{ vars.BACKEND_ECR_REPOSITORY_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! aws ecr describe-images --repository-name "${FRONTEND_REPOSITORY_NAME}" --image-ids imageTag="${RELEASE_SHA}" >/dev/null 2>&1; then
            docker push "${FRONTEND_REPOSITORY}:${RELEASE_SHA}"
          fi
          if ! aws ecr describe-images --repository-name "${BACKEND_REPOSITORY_NAME}" --image-ids imageTag="${RELEASE_SHA}" >/dev/null 2>&1; then
            docker push "${BACKEND_REPOSITORY}:${RELEASE_SHA}"
          fi
      - id: images
        name: Resolve immutable image digests
        env:
          FRONTEND_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
          BACKEND_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY }}
          FRONTEND_REPOSITORY_NAME: ${{ vars.FRONTEND_ECR_REPOSITORY_NAME }}
          BACKEND_REPOSITORY_NAME: ${{ vars.BACKEND_ECR_REPOSITORY_NAME }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          frontend_digest="$(aws ecr describe-images --repository-name "${FRONTEND_REPOSITORY_NAME}" --image-ids imageTag="${RELEASE_SHA}" --query 'imageDetails[0].imageDigest' --output text)"
          backend_digest="$(aws ecr describe-images --repository-name "${BACKEND_REPOSITORY_NAME}" --image-ids imageTag="${RELEASE_SHA}" --query 'imageDetails[0].imageDigest' --output text)"
          echo "frontend_image=${FRONTEND_REPOSITORY}@${frontend_digest}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${BACKEND_REPOSITORY}@${backend_digest}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-release
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      FRONTEND_SERVICE: ${{ vars.FRONTEND_SERVICE }}
      API_SERVICE: ${{ vars.API_SERVICE }}
      WORKER_SERVICE: ${{ vars.WORKER_SERVICE }}
      PRIVATE_SUBNET_IDS: ${{ vars.PRIVATE_SUBNET_IDS }}
      TASK_SECURITY_GROUP_ID: ${{ vars.TASK_SECURITY_GROUP_ID }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      SMOKE_ORG_SLUG: ${{ vars.SMOKE_ORG_SLUG }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
      WORKER_LOG_GROUP: ${{ vars.WORKER_LOG_GROUP }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Prepare immutable task definitions
        run: |
          deploy/scripts/prepare-task-definition.sh "${{ vars.FRONTEND_TASK_FAMILY }}" frontend "${{ needs.build-release.outputs.frontend_image }}" frontend-task.json
          deploy/scripts/prepare-task-definition.sh "${{ vars.API_TASK_FAMILY }}" api "${{ needs.build-release.outputs.backend_image }}" api-task.json
          deploy/scripts/prepare-task-definition.sh "${{ vars.WORKER_TASK_FAMILY }}" worker "${{ needs.build-release.outputs.backend_image }}" worker-task.json
      - name: Deploy staging services
        run: deploy/scripts/deploy-services.sh frontend-task.json api-task.json worker-task.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-previous-task-definitions-${{ github.event.workflow_run.head_sha }}
          path: previous-task-definitions.json
      - id: smoke
        name: Staging smoke
        run: deploy/scripts/smoke.sh
      - name: Verify worker accounting
        run: deploy/scripts/verify-worker-events.sh "${{ steps.smoke.outputs.request_id }}"
      - name: Roll back failed staging release
        if: failure() && hashFiles('previous-task-definitions.json') != ''
        run: deploy/scripts/rollback-services.sh previous-task-definitions.json

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-release, deploy-staging]
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      FRONTEND_SERVICE: ${{ vars.FRONTEND_SERVICE }}
      API_SERVICE: ${{ vars.API_SERVICE }}
      WORKER_SERVICE: ${{ vars.WORKER_SERVICE }}
      PRIVATE_SUBNET_IDS: ${{ vars.PRIVATE_SUBNET_IDS }}
      TASK_SECURITY_GROUP_ID: ${{ vars.TASK_SECURITY_GROUP_ID }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      SMOKE_ORG_SLUG: ${{ vars.SMOKE_ORG_SLUG }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
      WORKER_LOG_GROUP: ${{ vars.WORKER_LOG_GROUP }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Prepare same tested image digests
        run: |
          deploy/scripts/prepare-task-definition.sh "${{ vars.FRONTEND_TASK_FAMILY }}" frontend "${{ needs.build-release.outputs.frontend_image }}" frontend-task.json
          deploy/scripts/prepare-task-definition.sh "${{ vars.API_TASK_FAMILY }}" api "${{ needs.build-release.outputs.backend_image }}" api-task.json
          deploy/scripts/prepare-task-definition.sh "${{ vars.WORKER_TASK_FAMILY }}" worker "${{ needs.build-release.outputs.backend_image }}" worker-task.json
      - name: Deploy production services
        run: deploy/scripts/deploy-services.sh frontend-task.json api-task.json worker-task.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-previous-task-definitions-${{ github.event.workflow_run.head_sha }}
          path: previous-task-definitions.json
      - id: smoke
        name: Production smoke
        run: deploy/scripts/smoke.sh
      - name: Verify worker accounting
        run: deploy/scripts/verify-worker-events.sh "${{ steps.smoke.outputs.request_id }}"
      - name: Roll back failed production release
        if: failure() && hashFiles('previous-task-definitions.json') != ''
        run: deploy/scripts/rollback-services.sh previous-task-definitions.json
