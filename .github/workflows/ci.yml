name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --pool=threads --maxWorkers=1 --no-file-parallelism --testTimeout=30000
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0.12
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.2-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      LOG_LEVEL: info
      PORT: 8080
      FRONTEND_ORIGIN: http://localhost:3000
      MONGO_URI: mongodb://127.0.0.1:27017/proxiai_ci
      REDIS_URL: redis://127.0.0.1:6379
      ACCESS_TOKEN_TTL_MINUTES: 15
      REFRESH_TOKEN_TTL_DAYS: 7
      CHAT_RATE_LIMIT_FREE_USER_RPM: 10
      CHAT_RATE_LIMIT_FREE_ORG_RPM: 60
      CHAT_RATE_LIMIT_PRO_USER_RPM: 30
      CHAT_RATE_LIMIT_PRO_ORG_RPM: 300
      CHAT_RATE_LIMIT_ENTERPRISE_USER_RPM: 60
      CHAT_RATE_LIMIT_ENTERPRISE_ORG_RPM: 1200
      IDEMPOTENCY_PROCESSING_TTL_SECONDS: 300
      IDEMPOTENCY_COMPLETED_TTL_SECONDS: 3600
      GROQ_API_KEY: ci_non_network_provider_key
      GROQ_MODEL: openai/gpt-oss-20b
      PROVIDER_REQUEST_TIMEOUT_MS: 30000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Create test-only secrets
        run: |
          jwt_secret="$(node -e "process.stdout.write(Buffer.alloc(32, 1).toString('base64url'))")"
          rate_limit_secret="$(node -e "process.stdout.write(Buffer.alloc(32, 2).toString('base64url'))")"
          printf 'JWT_ACCESS_SECRET=%s\n' "$jwt_secret" >> "$GITHUB_ENV"
          printf 'AUTH_RATE_LIMIT_SECRET=%s\n' "$rate_limit_secret" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - run: docker build --tag proxiai-frontend:ci frontend
      - run: docker build --tag proxiai-backend:ci backend
